<c-vars 
    userName = "John Doe"
    userRole = "Community Member"
/>

<h1 class="text-2xl font-bold mb-4">Welcome, {{ userName }}!</h1>
<div class="w-full flex flex-col justify-around md:flex-row gap-4">
    <c-dbcard label="Tenants" value="88" description="Active tenants" filled=True />
    <c-dbcard label="Properties" value="12" description="Total properties" filled=False />
    <c-dbcard label="Maintenance Requests" value="5" description="Pending requests" filled=False />
    <c-dbcard label="Announcements" value="3" description="New announcements" filled=False />
</div>

<div class="flex flex-col md:flex-row">
    <div class="w-full py-4">
    <c-ui.card>
        <div class="flex justify-between">
            <h1 class="text-2xl font-bold mb-4">Open Service Tickets</h1>
            <c-ui.button size="lg" variant="text" href="/tickets">View All</c-ui.button>
        </div>  
        <c-ui.table>
                <tbody>
                    <tr>
                        <td><b>Unit 4A</b></td>
                        <td>Leaky faucet in apartment 3B</td>
                        <td>Open</td>
                        <td><c-ui.badge color="red">High</c-ui.badge></td>
                        <td>Oct 12, 2023</td>
                    </tr>
                    <tr>
                        <td><b>Unit 4B</b></td>
                        <td>Broken window in apartment 2A</td>
                        <td>In Progress</td>
                        <td><c-ui.badge color="yellow">Medium</c-ui.badge></td>
                        <td>Oct 14, 2023</td>
                    </tr>
                </tbody>
            </c-ui.table>
        </c-ui.card>
    </div>
    <div class="w-full md:w-1/3 p-4">
        <c-dbcard label="Upcoming Events" value="View" description="See upcoming events" filled=False />
    </div>
</div>
