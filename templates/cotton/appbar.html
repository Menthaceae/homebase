<c-vars 
    brand="HomeBase" 
    is-logged-in=user.is_authenticated 
    username="user.username" 
    avatar-url="user.avatar_url" 
/>

<c-ui.navbar>

    <div class="navbar">

        <!-- Brand -->
        <div class="flex-1 text-left">
            <a href="/" class="flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="size-6 text-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 12v2a2 2 0 0 1-2 2H9a1 1 0 0 0-1 1v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2h0"/><path d="M4 16a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3a1 1 0 0 1-1 1h-5a2 2 0 0 0-2 2v2"/></svg>
                <span class="font-bold cursor-pointer">Homebase</span>
            </a>
        </div>

        <!-- Search bar -->
        {%if page != 'register' and page != 'login' %}
        <div class="appbar-search">
            <c-search-bar />
        </div>
        {% endif %}
        
        <!-- Actions -->
        <div class="flex flex-1 justify-end flex-row items-center gap-2">
            {% if user.is_authenticated %}
            <c-ui.nav.item href="{% url 'home' %}" class="rounded-full {% if active_page == 'home' %}active{% else %}inactive{% endif %}" current>Feed</c-ui.nav.item>
            <c-ui.nav.item href="#" class="{% if active_page == 'homebase' %}active{% else %}inactive{% endif %}" current>Homebase</c-ui.nav.item>
            <c-ui.button class="rounded-full {% if active_page == 'notifications' %}active{% else %}inactive{% endif %}">
                <i class="ti ti-bell"></i>
            </c-ui.button>
            <c-ui.button class="rounded-full {% if active_page == messages %}active{% else %}inactive{% endif %}">
                <i class="ti ti-messages"></i>
            </c-ui.button>
            <c-ui.dropdown position="bottom">
                <c-slot name="trigger">
                    <button type="button" class="flex flex-row items-center gap-2 p-2 rounded-md hover:bg-ink-100" aria-label="More options">
                        <c-ui.avatar size="sm" ></c-ui.avatar>
                        <span class="text-sm font-medium">{{ user.first_name }} {{ user.last_name }}</span>
                    </button>
                </c-slot>
                <c-ui.dropdown.item href="/profile">
                    <c-slot name="icon">
                        <i class="ti ti-user-circle"></i>
                    </c-slot>
                    Profile
                </c-ui.dropdown.item>
                 <c-ui.dropdown.item href="#">
                    <c-slot name="icon">
                        <svg class="w-[16px] h-[16px] text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15v4m6-6v6m6-4v4m6-6v6M3 11l6-5 6 5 5.5-5.5"/>
                        </svg>
                    </c-slot>
                    Dashboard
                </c-ui.dropdown.item>
                <c-ui.dropdown.separator />
                <form method="POST" action="/logout/">
                    {% csrf_token %}
                    <c-ui.dropdown.item onclick="document.getElementById('logout').click()">
                        <c-slot name="icon">
                            <i class="ti ti-logout"></i>
                        </c-slot>
                        Logout
                    </c-ui.dropdown.item>
                    <c-ui.button id="logout" hidden type="submit" size="sm" variant="danger" style="background: none; color: black; border: none; text-decoration: none; cursor: pointer; padding: 0; font: inherit;">
                    </c-ui.button>
                </form>
            </c-ui.dropdown>
            {% else %}
            <c-ui.button href="/login" size="sm">Sign in</c-ui.button>
            <c-ui.button href="/register" size="sm" variant="primary">Sign up</c-ui.button>
            {% endif %}
        </div>
    </div>
        
</c-ui.navbar>
