<c-vars 
    is-logged-in=user.is_authenticated 
    username="user.username" 
    avatar-url="user.avatar_url" 
/>

<c-ui.navbar>

    <div class="navbar">

        <!-- Brand -->
        <div class="flex-1 text-left">
            <a href="/" class="flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="size-6 text-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 12v2a2 2 0 0 1-2 2H9a1 1 0 0 0-1 1v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2h0"/><path d="M4 16a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3a1 1 0 0 1-1 1h-5a2 2 0 0 0-2 2v2"/></svg>
                <span class="font-bold cursor-pointer">Homebase</span>
            </a>
        </div>

        <!-- Search bar -->
        {%if page != 'register' and page != 'login' %}
        <div class="appbar-search">
            <c-search-bar />
        </div>
        {% endif %}
        
        <!-- Actions -->
        <div class="flex flex-1 justify-end flex-row items-center gap-4">
            {% if user.is_authenticated %}
            <!-- Home -->
            <c-ui.nav.item href="{% url 'home' %}" class="rounded-full border border-ink-200 dark:bg-ink-400/30 dark:text-ink-300 dark:border-ink-300/20 shadow
                    cursor-pointer whitespace-nowrap rounded-button text-sm py-2 px-4 font-medium transition text-center focus-ring active:opacity-100
                    disabled:opacity-75 disabled:cursor-not-allowedrounded-full inactive" current>
                <svg class="w-[16px] h-[16px] text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="{% if active_page == 'home' %}currentColor{% else %}none{% endif %}" viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m4 12 8-8 8 8M6 10.5V19a1 1 0 0 0 1 1h3v-3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v3h3a1 1 0 0 0 1-1v-8.5"/>
                </svg>
            </c-ui.nav.item>
            <!-- Notifications -->
            <c-ui.button class="rounded-full">
                {% if active_page == 'notifications' %}
                <svg class="w-[16px] h-[16px] text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                    <path fill-rule="evenodd" d="M4 3a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h1v2a1 1 0 0 0 1.707.707L9.414 13H15a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1H4Z" clip-rule="evenodd"/>
                    <path fill-rule="evenodd" d="M8.023 17.215c.033-.03.066-.062.098-.094L10.243 15H15a3 3 0 0 0 3-3V8h2a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-1v2a1 1 0 0 1-1.707.707L14.586 18H9a1 1 0 0 1-.977-.785Z" clip-rule="evenodd"/>
                </svg>
                {% else %}
                <svg class="w-[16px] h-[16px] text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5.365V3m0 2.365a5.338 5.338 0 0 1 5.133 5.368v1.8c0 2.386 1.867 2.982 1.867 4.175 0 .593 0 1.292-.538 1.292H5.538C5 18 5 17.301 5 16.708c0-1.193 1.867-1.789 1.867-4.175v-1.8A5.338 5.338 0 0 1 12 5.365ZM8.733 18c.094.852.306 1.54.944 2.112a3.48 3.48 0 0 0 4.646 0c.638-.572 1.236-1.26 1.33-2.112h-6.92Z"/>
                </svg>
                {% endif %}

            </c-ui.button>
            <!-- Messages -->
            <c-ui.nav.item  
                href="{% url 'view_all_messages' %}"
                class="rounded-full border border-ink-200 dark:bg-ink-400/30 dark:text-ink-300 dark:border-ink-300/20 shadow
                    cursor-pointer whitespace-nowrap rounded-button text-sm py-2 px-4 font-medium transition text-center focus-ring active:opacity-100
                    disabled:opacity-75 disabled:cursor-not-allowedrounded-full inactive">
                <svg class="w-[16px] h-[16px] text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="{% if active_page == messages %}currentColor{% else %}none{% endif %}" viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17h6l3 3v-3h2V9h-2M4 4h11v8H9l-3 3v-3H4V4Z"/>
                </svg>
            </c-ui.nav.item>
            <c-ui.dropdown position="bottom">
                <c-slot name="trigger">
                    <button type="button" class="flex flex-row items-center gap-2 p-2 rounded-md hover:bg-ink-100" aria-label="More options">
                        <c-ui.avatar size="sm" ></c-ui.avatar>
                        <span class="text-sm font-medium">{{ user.first_name }} {{ user.last_name }}</span>
                    </button>
                </c-slot>
                <c-ui.dropdown.item href="{% url 'profile' %}">
                    <c-slot name="icon">
                        <i class="ti ti-user-circle"></i>
                    </c-slot>
                    Profile
                </c-ui.dropdown.item>
                 <c-ui.dropdown.item href="{% url 'dashboard' %}">
                    <c-slot name="icon">
                        <svg class="w-[16px] h-[16px] text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15v4m6-6v6m6-4v4m6-6v6M3 11l6-5 6 5 5.5-5.5"/>
                        </svg>
                    </c-slot>
                    Dashboard
                </c-ui.dropdown.item>
                <c-ui.dropdown.separator />
                <form method="POST" action="/logout/">
                    {% csrf_token %}
                    <c-ui.dropdown.item onclick="document.getElementById('logout').click()">
                        <c-slot name="icon">
                            <i class="ti ti-logout"></i>
                        </c-slot>
                        Logout
                    </c-ui.dropdown.item>
                    <c-ui.button id="logout" hidden type="submit" size="sm" variant="danger" style="background: none; color: black; border: none; text-decoration: none; cursor: pointer; padding: 0; font: inherit;">
                    </c-ui.button>
                </form>
            </c-ui.dropdown>
            {% else %}
            <c-ui.button href="/login" size="sm">Sign in</c-ui.button>
            <c-ui.button href="/register" size="sm" variant="primary">Sign up</c-ui.button>
            {% endif %}
        </div>
    </div>
</c-ui.navbar>
