<c-vars
  title="Events"
  description="Upcoming events in the community"
  date="June 15th, 2024" 
  location="Community Park"
  image="{% static 'images/event.jpeg' %}"
/>

<c-ui.card>
  <div class="flex flex-col md:flex-row gap-4">
    <div class="md:w-1/3">
      <img src="{{ image }}" alt="Event Image" class="w-full h-auto rounded">
    </div>
    <div class="md:w-2/3">
      <h2 class="text-xl font-bold mb-2">{{ title }}</h2>
      <p class="text-sm text-gray-500 mb-2">{{ date }} | {{ location }}</p>
      <p class="text-base">{{ description }}</p>
    </div>
  </div>
</c-ui.card>
