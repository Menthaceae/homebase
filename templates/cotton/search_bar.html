

<form method="GET" action="{{ action|default:''}}" class="flex items-center gap-2">

    <div class="relative">

        <input
            type="search"
            name="{{ name|default:'query' }}"
            value="{{  value|default:'' }}"
            placeholder="{{ placeholder|default:'Search posts, announcements, marketplace...' }}"
            {{ attrs }}
            class="search-bar"
        />

    </div>

</form>
