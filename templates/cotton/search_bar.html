

<form method="GET" action="{{ action|default:''}}" class="flex items-center gap-2">

    <div class="relative">

        <input
            type="search"
            name="{{ name|default:'q' }}"
            value="{{  value|default:'' }}"
            placeholder="{{ placeholder|default:'Search announcements, requests, events...' }}"
            {{ attrs }}
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-blue-500"
        />

    </div>

</form>
