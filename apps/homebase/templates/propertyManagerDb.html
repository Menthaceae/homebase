{% load static %}

<c-layout>
<h1 class="text-2xl font-bold mb-4">Welcome, {{username}}!</h1>
<div class="w-full flex flex-col justify-around md:flex-row gap-4">
    <c-dbcard label="Tenants" value={{tenants_count}} description="Active tenants" filled=True />
    <c-dbcard label="Properties" value={{properties_count}} description="Total properties" filled=False />
    <c-dbcard label="Maintenance Requests" value="5" description="Pending requests" filled=True />
    <c-dbcard label="Announcements" value="3" description="New announcements" filled=False />
</div>


<div class="py-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        {% for homebase in managed_homebases %}
        <a href='/homebase/manage/{{homebase.id}}/'>
            <c-ui.card class="flex justify-between gap-2 items-center col-span-1">
            <div class="flex flex-col">
                <h1 class="text-2xl font-bold mb-4">{{homebase.name}}</h1>
                <p>{{homebase.street_address}}</p>
                <p>This homebase contians 12 properties and 12 tenants.</p>
            </div>
            </c-ui.card> 
        </a>            
        {% endfor %}
    </div> 
</div>
<div class="flex flex-col md:flex-row">
    <div class="w-full py-4">
    <c-ui.card>
        <div class="flex justify-between">
            <h1 class="text-2xl font-bold mb-4">Open Service Tickets</h1>
            <c-ui.button size="lg" variant="text" href="/tickets">View All</c-ui.button>
        </div>  
        <c-ui.table>
            <tbody>
                <c-maintenanceTable />
                <c-maintenanceTable />
            </tbody>
            </c-ui.table>
        </c-ui.card>
    </div>
    <div class="w-full md:w-1/3 p-4">
        <c-ui.card>
            <h1 class="text-2xl font-bold mb-4">Upcoming Events</h1>
            <c-event title="Community BBQ" image="{% static 'images/bbq.jpeg' %}" description="Join us for a fun-filled community BBQ event! Enjoy delicious food, games, and great company." date="June 15th, 2024" location="Community Park" />
        </c-ui.card>
    </div>
</div>
</c-layout>
