<c-vars form />

<form method="POST" class="space-y-6">
    {% csrf_token %}

    <!-- Always visible: Subproperty Details -->
    <div class="space-y-2">
        <c-ui.input 
            name="room_number" 
            label="Room Number" 
            placeholder="Enter the room number" 
            required
        />
        
        <c-ui.select 
            name="classification" 
            label="Classification" >
            <c-ui.select.option value="rental">Rental</c-ui.option>
            <c-ui.select.option value="owned">Owned</c-ui.option>
        </c-ui.select>
        
        <c-ui.select 
            name="status" 
            label="Status" 
            >
            <c-ui.select.option value="available">Available</c-ui.option>
            <c-ui.select.option value="occupied">Occupied</c-ui.option>
            <c-ui.select.option value="maintenance">Maintenance</c-ui.option>
        </c-ui.select >  

        {% if form.errors %}
            <c-ui.alert variant="error">
                <ul>
                    {% for field in form %}
                        {% for error in field.errors %}
                            <li>{{ error }}</li>
                        {% endfor %}
                    {% endfor %}
                    {% for error in form.non_field_errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            </c-ui.alert>
        {% endif %}
    </div>
    <c-ui.button type="submit" variant="primary">Save Subproperty</c-ui.button>
</form>
