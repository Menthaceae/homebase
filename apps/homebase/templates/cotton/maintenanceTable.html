<c-vars :ticket="ticket" />
<tr>
    <td><b>{{ ticket.rental.subproperty.room_number }}</b></td>
    <td>{{ ticket.title }}</td>
    <td>{{ ticket.created_at }}</td>
    <td><c-ui.badge color="red">{{ ticket.priority|default:ticket.priority }}</c-ui.badge></td>
    <td>{{ ticket.status }}</td>
</tr>
