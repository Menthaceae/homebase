<c-vars rental />
<tr>
    <td><b>{{ rental.subproperty.room_number }}</b></td>
    <td>{% if rental.tenant %}{{ rental.tenant.user.first_name }} {{ rental.tenant.user.last_name }}{% else %}-{% endif %}</td>
    <td><b>${{ rental.rent }}</b></td>
    <td>{{ rental.start_date }}</td>
    <td>{{ rental.end_date }}</td>
    <td>{{ rental.occupied }}</td>
</tr>
