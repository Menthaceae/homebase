<div>
  {% for user in users %}
    <div class="flex flex-row gap-2">
      {% if user.photo %}
      <img class="profile-picture" src="{{ user.photo }}" alt="{{ user.username }}'s profile picture">
      {% else %}
      <img class="profile-picture" src="" alt="Default avatar">
      {% endif %}
      <p>{{ user.first_name }} {{ user.last_name }}</p>
    </div>
  {% endfor %}
</div>
