
{% load static %}

<form action="{% url 'update_profile' %}" method="POST" enctype="multipart/form-data">

    {% csrf_token %}

    <section
        x-show="editing"
        x-cloak
        class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm"
        x-data="{
            imagePreview: null,

            previewImage(event) {
                const file = event.target.files[0];

                if (file) {
                    this.imagePreview = URL.createObjectURL(file);
                }
            }
        }"
    >
        <div class="flex flex-col gap-5 sm:flex-row sm:items-center">

            <!-- Profile picture -->
            <div class="flex flex-col items-center gap-3">
            <div class="flex h-24 w-24 items-center justify-center rounded-full bg-blue-100 font-semibold text-blue-700">
                    <template x-if="imagePreview || {% if user.photo %}true{% else %}false{% endif %}">
                        <img
                            :src="imagePreview || '{{ user.photo.url|default:'' }}'"
                            alt="Profile photo"
                            class="h-24 w-24 rounded-full object-cover"
                        >
                    </template>

                    <template x-if="!imagePreview && {% if user.photo %}false{% else %}true{% endif %}">
                        <span style="font-size: 36px;">
                            {{ user.first_name|default:user.username|first|upper }}
                        </span>
                    </template>
                </div>

                <label
                    for="photo"
                    class="cursor-pointer rounded-lg border border-gray-300 px-4 py-2 text-sm hover:bg-gray-50"
                >
                    Change Photo
                </label>

                <input
                    type="file"
                    id="photo"
                    name="photo"
                    accept="image/*"
                    class="hidden"
                    @change="previewImage($event)"
                >
            </div>

            <!-- Profile information -->
            <div class="min-w-0 flex-1">
                <h2 class="text-xl font-semibold text-gray-900">
                    Edit Profile
                </h2>

                <p class="mt-2 text-sm text-gray-500">
                    Update your profile information.
                </p>
            </div>

            <!-- Actions -->
            <div class="flex gap-2">
                <button
                    type="button"
                    @click="editing = false"
                    class="cursor-pointer rounded-lg border border-gray-300 px-4 py-2 text-sm hover:bg-gray-50"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="cursor-pointer rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700"
                >
                    Save Changes
                </button>
            </div>

        </div>

    </section>

    <!-- Personal Information -->
    <section 
        x-show="editing"
        x-cloak
        class="mt-4 rounded-2xl border border-gray-200 bg-white p-6 shadow-sm"
    >
        <div class="p-4">
            <h1 class="text-lg font-semibold mb-4 uppercase">About me</h1>
            
            <textarea 
                id="bio"
                name="bio"
                rows="3"
                class="p-4 rounded-xl border border-gray-200 bg-white w-full"
                placeholder ="Share more about yourself"
            >{{ form.bio.value|default_if_none:'' }}</textarea>

        </div>

        {% if form.errors %}
            <div class="mt-2 text-sm text-red-600">
                {% for field in form %}
                    {% for error in field.errors %}
                        <p>{{ error }}</p>
                    {% endfor %}
                {% endfor %}

                {% for error in form.non_field_errors %}
                    <p>{{ error }}</p>
                {% endfor %}
            </div>
        {% endif %}

    </section>
</form>
