<c-layout>
    <div class="flex min-h-[calc(100vh-4rem)] items-center justify-center p-4">
        <c-ui.card class="w-full max-w-md p-8 shadow-sm">
            
            <div class="mb-6 text-center">
                <h1 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white">Sign in</h1>
                <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Welcome back! {{page}} Please enter your details.</p>
            </div>

            {% if form.errors %}
                <c-ui.Alert type="error" class="mb-4">
                    Your username and password did not match. Please try again.
                </c-ui.Alert>
            {% endif %}

            <form method="post" action="/login/" class="space-y-4">
                {% csrf_token %}

                <div>
                    <c-ui.input 
                        label="Username" 
                        name="username" 
                        type="text" 
                        required 
                        autofocus 
                    />
                </div>

                <div>
                    <c-ui.input 
                        label="Password" 
                        name="password" 
                        type="password" 
                        required 
                    />
                </div>

                <div class="pt-2">
                    <c-ui.button url="/login/" variant="primary" type="submit" class="w-full">
                        Sign In
                    </c-ui.button>
                </div>
            </form>

            <p class="mt-6 text-center text-sm text-gray-500 dark:text-gray-400">
                Don't have an account? 
                <a href="register/" class="font-medium text-accent hover:underline">
                    Sign up
                </a>
            </p>

        </c-ui.card>
    </div>
</c-layout>
