<!-- posts/templates/cotton/post-create.html -->

<dialog
    id="create-post-modal"
    class="w-full max-w-lg rounded-xl p-0 shadow-xl"
>
    <div class="p-6">

        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h2 class="text-xl font-semibold">
                    Create a Post
                </h2>

                <p class="text-sm text-gray-500 mt-1">
                    Share something with your community.
                </p>
            </div>

            <button
                type="button"
                onclick="this.closest('dialog').close()"
                class="text-gray-500 hover:text-gray-800"
            >
                <i class="ti ti-x text-xl"></i>
            </button>
        </div>


        <!-- Post content -->
        <form>

            <textarea
                name="content"
                rows="6"
                placeholder="What's on your mind?"
                class="w-full resize-none rounded-lg border border-gray-300 p-3
                       focus:outline-none focus:ring-2 focus:ring-primary"
            ></textarea>


            <!-- Bottom actions -->
            <div class="flex items-center justify-between mt-4">

                <!-- Future options -->
                <div class="flex items-center gap-2">
                    <button
                        type="button"
                        class="p-2 rounded-lg hover:bg-gray-100"
                        title="Add image"
                    >
                        <i class="ti ti-photo text-xl"></i>
                    </button>

                    <button
                        type="button"
                        class="p-2 rounded-lg hover:bg-gray-100"
                        title="Add attachment"
                    >
                        <i class="ti ti-paperclip text-xl"></i>
                    </button>
                </div>


                <!-- Modal actions -->
                <div class="flex gap-2">
                    <button
                        type="button"
                        onclick="this.closest('dialog').close()"
                        class="px-4 py-2 rounded-lg border border-gray-300"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="px-4 py-2 rounded-lg"
                    >
                        Post
                    </button>
                </div>

            </div>

        </form>

    </div>
</dialog>
