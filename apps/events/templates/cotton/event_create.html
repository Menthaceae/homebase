{% load static %}
<!-- Form: Create event-->
<dialog
    id="create-event-modal"
    class="w-full max-w-lg rounded-xl p-0 shadow-xl"
>
    <div class="modal-content">
        <!--TODO: Make form details required when form is selected-->
        <!--TODO: Add required-->
        <form action="" method="POST">
            {% csrf_token %}

            <!-- Author -->
            <input 
                type="hidden"
                id="author"
                name="author"
                value="{{ user }}"
            >

            <!-- Cover iamage-->
            <div class="image-uploader">
                <i class="icons ti ti-photo-search"></i>
                <label>Add a cover photo</label>
                <div class="image-input">

                    <input 
                        type="file" 
                        id="image"
                        name="image"
                        alt="File submission" 
                        width="48" 
                        height="48"
                        hidden
                    >

                    <c-ui.button
                        type="button"
                        onclick="document.getElementById('event-photo').click()"
                    >
                    Upload
                    </c-ui.button>
                </div>
            </div>

            <div class="event-logistics">
                <c-row class="logistics" cols="1" gap="3">
                    <!--Event name -->
                    <c-col class="logistic">
                        <label class="required">Event name</label>
                        <input 
                            type="text"
                            id="title"
                            name="title"
                            label="Event name"
                            required
                        >
                    </c-col>
                    <!-- Event date-->
                    <c-col class="logistic">
                        <label class="required">Event Date</label>
                        <input 
                            type="date" 
                            id="date"
                            name="date"
                            lable="Date" 
                        >
                    </c-col>
                    <c-row cols="2">
                        <!-- Start time-->
                        <c-col class="logistic">
                            <label class="required">Start time</label>
                            <input 
                                type="time" 
                                id="start_time" 
                                name="start_time" 
                                label="Start time" 
                            >
                        </c-col>
                        <!-- End time-->
                        <c-col class="logistic">
                            <label>End time</label>
                            <input 
                                type="time" 
                                id="end_time" 
                                name="end_time" 
                                label="End time"
                            >
                        </c-col>
                    </c-row>
                </c-row>

                <!-- Location -->
                <input 
                    class="logistic required" 
                    type="text" 
                    id="location" 
                    name="location" 
                    placeholder="Enter location or video link (required)" 
                >

                <!-- Post to -->
                <label class="required">Choose which feed to post to</label>
                <select id="post_to" name="post_to">
                    <option value="public">Public</option>
                    <!--TODO: Check if user has homebase-->
                    <!--TODO: Select which homebase to post to-->
                    <option value="public">Homebase</option>
                    <option value="public">Nearby</option>

                </select>

                <!-- Additional details -->
                <textarea 
                    class="logistic" 
                    id="details" 
                    name="details" 
                    rows="5" 
                    placeholder="Additional details"
                >
                </textarea>
            </div>

            <!-- Footer -->
            <div class="event-form-footer">
                <c-ui.button 
                    type="button"
                    onclick="document.getElementById('create-event-modal').close()"
                >
                    Cancel</c-ui.button>
                <c-ui.button type="submit">Submit</c-ui.button>
            </div>

        </form>

    </div>

</dialog>

<c-post-create />
