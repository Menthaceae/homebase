{% load static %}
<!-- Form: Create event-->
<dialog
    id="create-event-modal"
    class="w-full max-w-lg rounded-xl p-0 shadow-xl"
>
    <div class="event-modal-content">
        <form action="" method="POST" class="event-form">
            {% csrf_token %}

            <!-- Author -->
            <input
                type="hidden"
                id="author"
                name="author"
                value="{{ user }}"
            >

            <!-- Cover image -->
            <div class="image-uploader">
                <div class="image-uploader-icon">
                    <i class="icons ti ti-photo-search"></i>
                </div>

                <div class="image-uploader-text">
                    <label for="image">Add a cover image</label>
                    <p>Make your event stand out with a cover photo.</p>
                </div>

                <div class="image-input">
                    <input
                        type="file"
                        id="image"
                        name="image"
                        hidden
                    >

                    <c-ui.button
                        type="button"
                        onclick="document.getElementById('event-photo').click()"
                    >
                        Upload image
                    </c-ui.button>
                </div>
            </div>

            <div class="event-logistics">
                <h3 class="event-section-title">Event information</h3>

                <div class="event-fields-grid">
                    <!-- Event name -->
                    <div class="logistic">
                        <label for="title" class="required">Event name</label>
                        <input
                            type="text"
                            id="title"
                            name="title"
                            placeholder="Give your event a name"
                            required
                        >
                    </div>

                    <!-- Event date -->
                    <div class="logistic">
                        <label for="date" class="required">Event date</label>
                        <input
                            type="date"
                            id="date"
                            name="date"
                        >
                    </div>

                    <!-- Event duration -->
                    <div class="event-time-fields">
                        <div class="logistic">
                            <label for="start_time" class="required">Start time</label>
                            <input
                                type="time"
                                id="start_time"
                                name="start_time"
                            >
                        </div>

                        <div class="logistic">
                            <label for="end_time">End time</label>
                            <input
                                type="time"
                                id="end_time"
                                name="end_time"
                            >
                        </div>
                    </div>
                </div>

                <!-- Location -->
                <div class="logistic event-location">
                    <label for="location" class="required">Location</label>
                    <input
                        class="logistic-input"
                        type="text"
                        id="location"
                        name="location"
                        placeholder="Enter a location or video link"
                    >
                </div>

                <!-- Post to -->
                <div class="logistic event-post-to">
                    <label for="post_to" class="required">Post to</label>
                    <select id="post_to" name="post_to">
                        <option value="public">Public</option>
                        <!-- TODO: Check if user has homebase -->
                        <!-- TODO: Select which homebase to post to -->
                        <option value="public">Homebase</option>
                        <option value="public">Nearby</option>
                    </select>
                </div>

                <!-- Additional details -->
                <div class="logistic event-details">
                    <label for="details">Additional details</label>
                    <textarea
                        id="details"
                        name="details"
                        rows="5"
                        placeholder="Tell people more about your event..."
                    ></textarea>
                </div>
            </div>

            <!-- Footer -->
            <div class="event-form-footer">
                <c-ui.button
                    type="button"
                    onclick="document.getElementById('create-event-modal').close()"
                >
                    Cancel
                </c-ui.button>

                <c-ui.button type="submit">
                    Create event
                </c-ui.button>
            </div>
        </form>
    </div>

</dialog>

<c-post-create />
