{% load static %}
<!-- Form: Create event-->
<dialog
    id="create-event-modal"
    class="w-full max-w-lg rounded-xl p-0 shadow-xl"
>
    <div class="modal-content">
        <!--TODO: Make form details required when form is selected-->
        <!--TODO: Add required-->
        <form action="" method="POST">
            {% csrf_token %}

            <!-- Cover photo-->
            <div class="photo-uploader">
                <i class="icons ti ti-photo-search"></i>
                <p>Add a cover photo</p>
                <div class="image-input">

                    <input 
                        type="file" 
                        id="cover_photo"
                        name="cover_photo"
                        alt="File submission" 
                        width="48" 
                        height="48"
                        hidden
                    >

                    <c-ui.button
                        type="button"
                        onclick="document.getElementById('event-photo').click()"
                    >
                    Upload
                    </c-ui.button>
                </div>
            </div>

            <div class="event-logistics">
                <c-row class="logistics" cols="1" gap="3">
                    <!-- Event date-->
                    <c-col class="logistic">
                        <p class="required">Event Date</p>
                        <input 
                            type="date" 
                            id="date"
                            name="date"
                            lable="Date" 
                        >
                    </c-col>
                    <c-row cols="2">
                        <!-- Start time-->
                        <c-col class="logistic">
                            <p class="required">Start time</p>
                            <input 
                                type="time" 
                                id="start_time" 
                                name="start_time" 
                                label="Start time" 
                            >
                        </c-col>
                        <!-- End time-->
                        <c-col class="logistic">
                            <p>End time</p>
                            <input 
                                type="time" 
                                id="end_time" 
                                name="end_time" 
                                label="End time"
                            >
                        </c-col>
                    </c-row>
                </c-row>
                <!-- Location -->
                <input 
                    class="logistic required" 
                    type="text" 
                    id="location" 
                    name="location" 
                    placeholder="Enter location or video link (required)" 
                >

                <!-- Additional details -->
                <textarea 
                    class="logistic" 
                    id="description" 
                    name="description" 
                    rows="5" 
                    placeholder="Additional details"
                >
                </textarea>
            </div>

            <div class="event-form-footer">
                <c-ui.button 
                    type="button"
                    onclick="document.getElementById('create-event-modal').close()"
                >
                    Cancel</c-ui.button>
                <c-ui.button type="submit">Submit</c-ui.button>
            </div>

        </form>

    </div>

</dialog>

<c-post-create />
