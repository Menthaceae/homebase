{% load static %}
<c-vars homebase="" />

<div x-data="{
    start_date: '',
    start_time: '',
    showEndTime: false,
    end_date: '',
    end_time: '',

    updateEndDateTime() {
        if (!this.start_date || !this.start_time) return;

        const start = new Date(`${this.start_date}T${this.start_time}`);
        const end = new Date(start.getTime() + 60 * 60 * 1000);

        this.end_date = [
            end.getFullYear(),
            String(end.getMonth() + 1).padStart(2, '0'),
            String(end.getDate()).padStart(2, '0')
        ].join('-');

        this.end_time =
            String(end.getHours()).padStart(2, '0') + ':' +
            String(end.getMinutes()).padStart(2, '0');
    }
}">

<dialog
    id="create-event-modal"
    class="w-full max-w-lg rounded-xl p-0 shadow-xl"
>
    <div class="event-modal-content">
        <form method="POST" action="{% url 'create_event' %}" enctype="multipart/form-data" class="event-form">
            {% csrf_token %}

            <!-- Author -->
            <input
                type="hidden"
                id="author"
                name="author"
                value="{{ user }}"
            >

            <!-- Cover image -->
            <div class="image-uploader">
                <div class="image-uploader-icon">
                    <i class="icons ti ti-photo-search"></i>
                </div>

                <div class="image-uploader-text">
                    <label for="image">Add a cover photo</label>
                    <p>Make your event stand out with a cover photo.</p>
                </div>

                <div>
                    <label class="custom-file-upload">
                        <input
                            type="file"
                            class="event-input"
                            id="image"
                            name="image"
                            accept="image/*"
                        >
                        Upload image
                    </label>
                </div>
            </div>

            <!-- Preview image -->
            <div id="event-preview-container" class="mt-3">
            </div>

            <div class="event-logistics">
                <h3 class="event-section-title">Event information</h3>

                <div class="event-fields-grid">
                    <!-- Event name -->
                    <div class="logistic">
                        <label for="name" class="required">Event name</label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Give your event a name"
                            required
                        >
                    </div>

                    <!-- Event dates -->
                    <div class="event-date-fields">
                        <!-- Start date -->
                        <div class="logistic">
                            <label for="start_date" class="required">Start date</label>
                            <input
                                type="date"
                                id="start_date"
                                name="start_date"
                                x-model="start_date"
                                required
                            >
                        </div>
                        <!-- End date -->
                        <div class="end-date logistic" hidden>
                            <label for="end_date" class="required">End date</label>
                            <input 
                                type="date"
                                id="end_date"
                                name="end_date"
                                x-model="end_date"
                            >
                        </div>
                    </div>
                    
                    <!-- Event duration -->
                    <div class="event-time-fields">
                        <!-- Start time-->
                        <div class="logistic">
                            <label for="start_time" class="required">Start time</label>
                            <input
                                type="time"
                                id="start_time"
                                name="start_time"
                                x-model="start_time"
                                required
                            >
                        </div>

                        <!-- End time -->
                        <div class="end-time logistic" hidden>
                            <label for="end_time" class="required">End time</label>
                            <input
                                type="time"
                                id="end_time"
                                name="end_time"
                                x-model="end_time"
                            >
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <c-ui.switch
                        type="button"
                        id="add-end-time"
                        x-model="showEndTime"
                        @change="if (showEndTime) updateEndDateTime();
                                else { end_date = ''; end_time = ''}"
                    />
                    <span class="text-sm text-ink-700 dark:text-ink-300">Add end time</span>
                </div>

                <!-- Location -->
                <div class="logistic event-location">
                    <label for="location" class="required">Location</label>
                    <input
                        class="logistic-input"
                        type="text"
                        id="location"
                        name="location"
                        placeholder="Enter a location or video link"
                    >
                </div>

                {% if not homebase %}
                <!-- Post to -->
                <div class="logistic event-post-to">
                    <label for="post_to" class="required">Post to</label>
                    <select id="post_to" name="post_to">
                        <option value="public">Public</option>
                        <!-- TODO: Check if user has homebase -->
                        <!-- TODO: Select which homebase to post to -->
                        <option value="public">Homebase</option>
                    </select>
                </div>
                {% endif %}
                <!-- Additional details -->
                <div class="logistic event-details">
                    <label for="body" class="required">Additional details</label>
                    <textarea
                        id="body"
                        name="body"
                        rows="5"
                        placeholder="Tell people more about your event..."
                        required
                    ></textarea>
                </div>
            </div>

            {% if homebase %}
                <input type="hidden" name="homebase" value="{{ homebase }}">
                <input type="hidden" name="post_to" value="homebase">
            {% endif %}

            <!-- Footer -->
            <div class="event-form-footer">
                <c-ui.button
                    type="button"
                    onclick="document.getElementById('create-event-modal').close()"
                >
                    Cancel
                </c-ui.button>

                <c-ui.button type="submit">
                    Create event
                </c-ui.button>
            </div>
        </form>
    </div>
</dialog>

<c-post-create homebase="homebase" />
