<dialog
    id="search-users"
    x-init="    
        {% if messages %}
            {% for message in messages %}
                {%if 'reopen_chat' in message.tags %}
                    $nextTrick(() => $el.showModal())
                {% endif %}
            {% endfor %}
        {% endif %}"
    x-data="{
        users: [],
        search: '',
        selectedUsers: [],
        loading: false,

        async loadUsers() {
            if (this.users.length > 0) return;

            this.loading = true;

            try {
                const response = await fetch('messages/users/');

                if (!response.ok) {
                    throw new Error('Failed to load users');
                }

                const data = await response.json();
                this.users = data.users;

            } catch (error) {
                console.error(error);
            } finally {
                this.loading = false;
            }
        },

        get filteredUsers() {
            return this.users.filter(user => {
                const name = `${user.first_name} ${user.last_name}`.toLowerCase();
                return name.includes(this.search.toLowerCase());
            });
        }
    }"
    class="search-users absolute rounded-xl p-0"
>
    <!-- Error messages -->
    {% if messages %}
        {% for message in messages %}
            {% if 'reopen_chat' in message.tags %}
                <div class="rounded-lg bg-red-100 px-4 py-3 text-sm text-red-700 mb-4">
                    {{ message }}
                </div>
            {% endif %}
        {% endfor %}
    {% endif %}

    <!-- Search -->
    <div class="border-b border-gray-200 p-4">
        <input
            type="search"
            x-model="search"
            placeholder="Search users..."
            class="w-full rounded-lg border-0 bg-gray-100 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500"
        >
    </div>

    <!-- List users -->
    <div class="search-users max-h-96 overflow-y-auto p-2">

        <p x-show="loading" class="p-4 text-center text-gray-500">
            Loading users...
        </p>

        <template x-for="user in filteredUsers" :key="user.id">
            <button
                type="button"
                @click="
                    selectedUsers.some(selected => selected.id === user.id)
                        ? selectedUsers = selectedUsers.filter(selected => selected.id !== user.id)
                        : selectedUsers.push(user)
                "                
                class="flex w-full items-center gap-3 rounded-lg p-3 text-left hover:bg-gray-100"
                :class="{'bg-blue-50': selectedUsers.some(selected => selected.id === user.id)}"
            >
                <div class="flex h-10 w-10 items-center justify-center rounded-full bg-blue-100 font-semibold text-blue-700">
                    <!-- Show profile photo if one exists -->
                    <template x-if="user.photo">
                        <img
                            :src="user.photo"
                            class="h-full w-full rounded-full object-cover"
                            alt="Profile photo"
                        >
                    </template>

                    <!-- Otherwise, show the user's initial -->
                    <template x-if="!user.photo">
                        <span
                            x-text="(user.first_name || user.username)[0].toUpperCase()"
                        ></span>
                    </template>

                </div>

                <div>
                    <p
                        class="font-medium text-gray-900"
                        x-text="`${user.first_name} ${user.last_name}`.trim() || user.username"
                    ></p>

                    <p
                        class="text-sm text-gray-500"
                        x-text="`@${user.username}`"
                    ></p>
                </div>

                <span
                    x-show="selectedUsers.some(selected => selected.id === user.id)"
                    class="ml-auto text-blue-600"
                >
                    <i class="ti ti-check"></i>
                </span>
            </button>
        </template>

        <p
            x-show="!loading && filteredUsers.length === 0"
            class="p-4 text-center text-sm text-gray-500"
        >
            No users found.
        </p>
    </div>

    <!-- Start conversation -->
    <div class="border-t border-gray-200 p-4">

        <form action="{% url 'create_chat_group' %}" method="POST">
            {% csrf_token %}

            <template x-for="user in selectedUsers" :key="user.id">
                <input
                    type="hidden"
                    name="members"
                    :value="user.id"
                >
            </template>


            <button
                type="submit"
                :disabled="selectedUsers.length === 0"
                class="w-full rounded-lg bg-blue-600 px-4 py-2 text-white cursor-pointer disabled:opacity-50"
            >
                Start Chat
            </button>
        </form>
       
    </div>
</dialog>
