<!-- Full screen page displaying all chats -->
<c-layout>

    <div 
        class="flex overflow-hidden w-full fixed bg-white rounded"
        style="height: calc(100vh - 74px);"
        x-data="{
            chatContent: '',
            loading: false,
            sending: false,
            search: '',
            selectedChat: '{{ selected_chat.id|default:'' }}',

            init() {
                const initialUrl = '{{ initial_chat_url|default:'' }}';

                if (initialUrl && this.selectedChat) {
                    this.loadChat(initialUrl, this.selectedChat);
                }
            },

            async loadChat(url, chatId) {
                this.loading = true;

                try {
                    const response = await fetch(url, {
                        credentials: 'same-origin'
                    });

                    if (!response.ok) {
                        throw new Error('Could not load conversation');
                    }

                    this.chatContent = await response.text();
                    this.selectedChat = String(chatId);

                    this.$nextTick(() => {
                        this.scrollToBottom();
                    });

                } catch (error) {
                    console.error(error);
                } finally {
                    this.loading = false;
                }
            },

            async sendMessage(event) {
                const form = event.target;

                if (this.sending) return;

                this.sending = true;

                try {
                    const response = await fetch(form.action, {
                        method: 'POST',
                        body: new FormData(form),
                        credentials: 'same-origin'
                    });

                    if (!response.ok) {
                        throw new Error('Could not send message');
                    }

                    this.chatContent = await response.text();

                    this.$nextTick(() => {
                        this.scrollToBottom();
                    });

                } catch (error) {
                    console.error(error);
                } finally {
                    this.sending = false;
                }
            },

            scrollToBottom() {
                this.$nextTick(() => {
                    const list = this.$el.querySelector('[data-message-list]');

                    if (list) {
                        list.scrollTop = list.scrollHeight;
                    }
                });
            }
        }"
        @submit.prevent="sendMessage($event)"
    >

        <!-- LEFT: Conversation sidebar -->
        <aside class="flex w-80 shrink-0 flex-col border-r border-gray-200">

            <!-- Header -->
            <header class="flex items-center justify-between gap-3 border-b border-gray-200 px-5 py-4">

                <h2 class="text-xl font-semibold">Messages</h2>

                 <button
                    class="cursor-pointer"
                    type="button"
                    onclick = "const modal = document.getElementById('search-users');
                        modal.showModal();
                        Alpine.$data(modal).loadUsers();"
                >
                    <svg class="w-[16px] h-[16px] text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 5V4a1 1 0 0 0-1-1H8.914a1 1 0 0 0-.707.293L4.293 7.207A1 1 0 0 0 4 7.914V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5M9 3v4a1 1 0 0 1-1 1H4m11.383.772 2.745 2.746m1.215-3.906a2.089 2.089 0 0 1 0 2.953l-6.65 6.646L9 17.95l.739-3.692 6.646-6.646a2.087 2.087 0 0 1 2.958 0Z"/>
                    </svg>
                </button> 
            </header>

            <!-- Search -->
            <div class="border-b border-gray-200 p-4">
                <input
                    type="search"
                    x-model="search"
                    placeholder="Search conversations..."
                    class="w-full rounded-lg border-0 bg-gray-100 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500"
                >
            </div>


            <!-- Conversation list -->
            <div class="flex-1 overflow-y-auto">

                {% for chat in chats %}

                    <a
                        href="{% url 'get_all_messages' chat.id %}"
                        data-chat-id="{{ chat.id }}"
                        @click.prevent="loadChat($el.href, '{{ chat.id }}')"
                        :class="selectedChat == '{{ chat.id }}' ? 'bg-blue-50' : ''"
                        x-show="!search || $el.textContent.toLowerCase().includes(search.toLowerCase())"
                        class="flex items-center gap-3 border-b border-gray-100 p-4 hover:bg-gray-50"
                    >

                        <!-- Avatar placeholder -->
                        <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-blue-100 font-semibold text-blue-700">
                            {{ chat.name|default:"C"|first|upper }}
                        </div>

                        <div class="min-w-0 flex-1">
                            <p class="truncate font-medium text-gray-900">
                                {{ chat.name|default:"Conversation" }}
                            </p>

                            <p class="truncate text-sm text-gray-500">
                                Conversation
                            </p>
                        </div>

                    </a>

                {% empty %}

                    <p class="p-5 text-center text-sm text-gray-500">
                        You don't have any conversations yet.
                    </p>

                {% endfor %}

            </div>

        </aside>


        <!-- RIGHT: Active conversation -->
        <main class="flex min-w-0 flex-1 flex-col">

            <div
                x-show="loading"
                class="p-4 text-sm text-gray-500"
            >
                Loading conversation...
            </div>

            <div
                x-html="chatContent"
                class="flex min-h-0 flex-1 flex-col"
            ></div>

            <div
                x-show="!loading && !chatContent"
                class="flex flex-1 items-center justify-center"
            >
                <p class="text-gray-500">
                    Select a conversation to view messages.
                </p>
            </div>

        </main>

    </div>

</c-layout>
